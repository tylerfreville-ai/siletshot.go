name: Smoke Test Veil Browser Release APK

on:
  push:
    branches:
      - veil-browser-build
    paths:
      - .github/workflows/smoke-bounded.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download verified release-build artifact
        uses: actions/download-artifact@v4
        with:
          name: veil-browser-v2-build
          path: build
          github-token: ${{ github.token }}
          repository: tylerfreville-ai/siletshot.go
          run-id: 31982429738

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sign isolated smoke-test copy
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt \
            -keystore smoke-test.jks -storetype JKS \
            -storepass "$PASS" -keypass "$PASS" \
            -alias smoke -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Veil Smoke Test, O=Veil, C=US"
          java -jar build/tools/apksigner.jar sign \
            --ks smoke-test.jks --ks-key-alias smoke \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v4-signing-enabled false \
            --out Veil-Smoke-Test.apk \
            build/Veil-Browser-v2.0.0-unsigned.apk
          java -jar build/tools/apksigner.jar verify --verbose Veil-Smoke-Test.apk

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and validate compact and expanded layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          script: |
            bash -euxo pipefail <<'BASH'
            mkdir -p smoke-results
            adb devices -l | tee smoke-results/adb-devices.txt
            adb shell getprop > smoke-results/device-properties.txt
            adb install -r Veil-Smoke-Test.apk | tee smoke-results/install.txt

            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell am force-stop com.veil.browser
            adb logcat -c
            adb shell am start -W -n com.veil.browser/.BrowserActivity | tee smoke-results/compact-start.txt
            sleep 5
            COMPACT_PID="$(adb shell pidof com.veil.browser | tr -d '\r')"
            test -n "$COMPACT_PID"
            adb exec-out screencap -p > smoke-results/compact.png
            adb shell uiautomator dump /sdcard/compact.xml
            adb pull /sdcard/compact.xml smoke-results/compact.xml >/dev/null
            adb logcat -d --pid="$COMPACT_PID" -v threadtime > smoke-results/compact-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: com\.veil\.browser.*has died' smoke-results/compact-logcat.txt

            adb shell wm size 2208x1840
            adb shell wm density 420
            adb shell am force-stop com.veil.browser
            adb logcat -c
            adb shell am start -W -n com.veil.browser/.BrowserActivity | tee smoke-results/expanded-start.txt
            sleep 5
            EXPANDED_PID="$(adb shell pidof com.veil.browser | tr -d '\r')"
            test -n "$EXPANDED_PID"
            adb exec-out screencap -p > smoke-results/expanded.png
            adb shell uiautomator dump /sdcard/expanded.xml
            adb pull /sdcard/expanded.xml smoke-results/expanded.xml >/dev/null
            adb logcat -d --pid="$EXPANDED_PID" -v threadtime > smoke-results/expanded-logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: com\.veil\.browser.*has died' smoke-results/expanded-logcat.txt

            adb shell dumpsys package com.veil.browser > smoke-results/package.txt
            adb shell dumpsys activity activities > smoke-results/activity.txt
            grep -q 'Status: ok' smoke-results/compact-start.txt
            grep -q 'Status: ok' smoke-results/expanded-start.txt
            file smoke-results/compact.png smoke-results/expanded.png | tee smoke-results/screenshots.txt
            grep -q 'PNG image data, 1080 x 2400' smoke-results/screenshots.txt
            grep -q 'PNG image data, 2208 x 1840' smoke-results/screenshots.txt
            BASH

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veil-browser-v2-release-smoke-results
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7
