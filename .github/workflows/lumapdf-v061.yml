name: Build LumaPDF v0.6.1 Runtime Hardening APK

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.github/workflows/lumapdf-v061.yml'
      - '.lumapdf/v060-rel.patch.gz.b64'
      - '.lumapdf/v050.patch.gz.b64'
      - '.lumapdf/patch_v050_compilefix.py'
      - '.lumapdf/patch_v042.py'
      - '.lumapdf/v023s.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified LumaPDF v0.5 base
        shell: bash
        run: |
          set -euo pipefail
          cat .lumapdf/v023s.part* | base64 --decode > LumaPDF-base.zip
          echo 'e8ffe0fe190095ed9bf652e67f13be96e5eedb86d9359cd316755a27e27bc543  LumaPDF-base.zip' | sha256sum -c -
          unzip -tq LumaPDF-base.zip
          unzip -q LumaPDF-base.zip
          base64 --decode .lumapdf/lumapdf-dev.keystore.b64 > LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore
          test -s LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore
          python .lumapdf/patch_v042.py
          base64 --decode .lumapdf/v050.patch.gz.b64 | gzip -dc > v050.patch
          cd LumaPDF_RazrFold_2026_v02
          patch --dry-run -p1 < ../v050.patch
          patch -p1 < ../v050.patch
          cd ..
          python .lumapdf/patch_v050_compilefix.py

      - name: Apply verified v0.6 studio rebuild
        shell: bash
        run: |
          set -euo pipefail
          echo 'c8d0d290737c7a67e3206dd4b2a4353fc7d33149219a75387e0bbc7759ff2a39  .lumapdf/v060-rel.patch.gz.b64' | sha256sum -c -
          base64 --decode .lumapdf/v060-rel.patch.gz.b64 | gzip -dc > v060.patch
          echo '948d5240f259b1f6aa7f5f9ae81483f3cfea4ffa63e03e938ed8d8ad57f4ea1a  v060.patch' | sha256sum -c -
          cd LumaPDF_RazrFold_2026_v02
          patch --dry-run -p2 < ../v060.patch
          patch -p2 < ../v060.patch

      - name: Apply v0.6.1 native null-contract hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('LumaPDF_RazrFold_2026_v02')
          engine = root / 'app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt'
          build = root / 'app/build.gradle.kts'
          main = root / 'app/src/main/java/com/tstudio/lumapdf/MainActivity.kt'

          s = engine.read_text()
          required = [
              'page.getAnnotations().forEach { annot ->',
              'private fun findAnnotation(page: PDFPage, objectNumber: Int): PDFAnnotation? = page.getAnnotations().firstOrNull { candidate ->',
              'if (page.search(query).isNotEmpty()) hits += index',
              'require(page.search(probe).isNotEmpty()) {',
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'Expected v0.6 source pattern missing: {needle}')

          # MuPDF 1.28 JNI intentionally returns NULL when a page contains zero annotations.
          # Never call Kotlin collection extensions directly on that platform array.
          s = s.replace(
              '            page.getAnnotations().forEach { annot ->',
              '            val annotations = runCatching { page.getAnnotations() }.getOrNull().orEmpty()\n            annotations.forEach { annot ->',
              1,
          )
          s = s.replace(
              '''    private fun findAnnotation(page: PDFPage, objectNumber: Int): PDFAnnotation? = page.getAnnotations().firstOrNull { candidate ->\n        runCatching {\n            val obj = candidate.getObject()\n            obj.isIndirect() && obj.asIndirect() == objectNumber\n        }.getOrDefault(false)\n    }''',
              '''    private fun findAnnotation(page: PDFPage, objectNumber: Int): PDFAnnotation? {\n        val annotations = runCatching { page.getAnnotations() }.getOrNull().orEmpty()\n        return annotations.firstOrNull { candidate ->\n            runCatching {\n                val obj = candidate.getObject()\n                obj != null && obj.isIndirect() && obj.asIndirect() == objectNumber\n            }.getOrDefault(false)\n        }\n    }''',
              1,
          )
          s = s.replace('if (page.search(query).isNotEmpty()) hits += index', 'if (page.search(query).orEmpty().isNotEmpty()) hits += index')
          s = s.replace('require(page.search(probe).isNotEmpty()) {', 'require(page.search(probe).orEmpty().isNotEmpty()) {')

          # Add explicit render null guards for other JNI platform-return values.
          s = s.replace('            val bounds = page.bounds\n', '            val bounds = requireNotNull(page.bounds) { "MuPDF returned no page bounds." }\n', 1)
          s = s.replace(
              '            val pix = page.toPixmap(Matrix(scale), ColorSpace.DeviceRGB, false, true, "View")\n',
              '            val pix = requireNotNull(page.toPixmap(Matrix(scale), ColorSpace.DeviceRGB, false, true, "View")) { "MuPDF returned no rendered page." }\n',
              1,
          )
          s = s.replace('                val png = pix.asPNG()\n', '                val png = requireNotNull(pix.asPNG()) { "MuPDF could not encode the rendered page." }\n', 1)

          engine.write_text(s)

          b = build.read_text()
          b = b.replace('versionCode = 7', 'versionCode = 8')
          b = b.replace('versionName = "0.6.0-studio-rebuild"', 'versionName = "0.6.1-runtime-hardening"')
          build.write_text(b)

          m = main.read_text()
          m = m.replace(
              'statusView?.text = "Page ${pageIndex + 1} of ${engine.pageCount} · ${objects.textObjects.size} text blocks · ${objects.imageObjects.size} images"',
              'statusView?.text = "Page ${pageIndex + 1} of ${engine.pageCount} · ${objects.textObjects.size} text blocks · ${objects.imageObjects.size} images · editing ready"',
              1,
          )
          main.write_text(m)
          PY

      - name: Runtime contract regression guards
        shell: bash
        run: |
          set -euo pipefail
          ROOT='LumaPDF_RazrFold_2026_v02'
          ENGINE="$ROOT/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt"
          MAIN="$ROOT/app/src/main/java/com/tstudio/lumapdf/MainActivity.kt"
          BUILD="$ROOT/app/build.gradle.kts"

          grep -Fq 'versionCode = 8' "$BUILD"
          grep -Fq 'versionName = "0.6.1-runtime-hardening"' "$BUILD"
          grep -Fq 'val annotations = runCatching { page.getAnnotations() }.getOrNull().orEmpty()' "$ENGINE"
          grep -Fq 'page.search(query).orEmpty()' "$ENGINE"
          grep -Fq 'page.search(probe).orEmpty()' "$ENGINE"
          grep -Fq 'requireNotNull(page.toPixmap' "$ENGINE"
          grep -Fq 'editing ready' "$MAIN"
          ! grep -Fq 'page.getAnnotations().forEach' "$ENGINE"
          ! grep -Fq 'page.getAnnotations().firstOrNull' "$ENGINE"
          ! grep -Fq 'TYPE_FREE_TEXT' "$ENGINE"
          ! grep -Fq 'doc.bake(true, false)' "$ENGINE"
          ! grep -Fq 'bitmap.setPixels' "$ENGINE"
          echo 'PASS: MuPDF nullable-array and renderer contracts hardened'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable LumaPDF signing key
        shell: bash
        run: keytool -list -keystore LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore -storepass lumapdfdev -alias lumapdf-dev

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile LumaPDF v0.6.1
        working-directory: LumaPDF_RazrFold_2026_v02
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          file "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -Fq 'lib/arm64-v8a/libmupdf_java.so'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee LumaPDF-v061-badging.txt
          grep -Fq "versionCode='8'" LumaPDF-v061-badging.txt
          grep -Fq "versionName='0.6.1-runtime-hardening'" LumaPDF-v061-badging.txt
          cp "$APK" LumaPDF-ContentStudio-v0.6.1-RuntimeHardening-RazrFold.apk
          sha256sum LumaPDF-ContentStudio-v0.6.1-RuntimeHardening-RazrFold.apk | tee LumaPDF-v061-apk.sha256

      - name: Package matching source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf LumaPDF_RazrFold_2026_v02/.gradle LumaPDF_RazrFold_2026_v02/.kotlin LumaPDF_RazrFold_2026_v02/app/build
          zip -qr LumaPDF-v061-source.zip LumaPDF_RazrFold_2026_v02
          unzip -tq LumaPDF-v061-source.zip
          sha256sum LumaPDF-v061-source.zip | tee LumaPDF-v061-source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v061-APK
          path: |
            LumaPDF-ContentStudio-v0.6.1-RuntimeHardening-RazrFold.apk
            LumaPDF-v061-apk.sha256
            LumaPDF-v061-badging.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v061-Source
          path: |
            LumaPDF-v061-source.zip
            LumaPDF-v061-source.sha256
          if-no-files-found: error
          retention-days: 14
