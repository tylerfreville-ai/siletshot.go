name: Build LumaPDF v0.6.1 Runtime Hardening APK

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.github/workflows/lumapdf-v061.yml'
      - '.lumapdf/v061.patch.gz.b64'
      - '.lumapdf/v060-rel.patch.gz.b64'
      - '.lumapdf/v050.patch.gz.b64'
      - '.lumapdf/patch_v050_compilefix.py'
      - '.lumapdf/patch_v042.py'
      - '.lumapdf/v023s.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified LumaPDF v0.5 base
        shell: bash
        run: |
          set -euo pipefail
          cat .lumapdf/v023s.part* | base64 --decode > LumaPDF-base.zip
          echo 'e8ffe0fe190095ed9bf652e67f13be96e5eedb86d9359cd316755a27e27bc543  LumaPDF-base.zip' | sha256sum -c -
          unzip -tq LumaPDF-base.zip
          unzip -q LumaPDF-base.zip
          base64 --decode .lumapdf/lumapdf-dev.keystore.b64 > LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore
          test -s LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore
          python .lumapdf/patch_v042.py
          base64 --decode .lumapdf/v050.patch.gz.b64 | gzip -dc > v050.patch
          cd LumaPDF_RazrFold_2026_v02
          patch --dry-run -p1 < ../v050.patch
          patch -p1 < ../v050.patch
          cd ..
          python .lumapdf/patch_v050_compilefix.py

      - name: Apply verified v0.6 studio rebuild
        shell: bash
        run: |
          set -euo pipefail
          echo 'c8d0d290737c7a67e3206dd4b2a4353fc7d33149219a75387e0bbc7759ff2a39  .lumapdf/v060-rel.patch.gz.b64' | sha256sum -c -
          base64 --decode .lumapdf/v060-rel.patch.gz.b64 | gzip -dc > v060.patch
          echo '948d5240f259b1f6aa7f5f9ae81483f3cfea4ffa63e03e938ed8d8ad57f4ea1a  v060.patch' | sha256sum -c -
          cd LumaPDF_RazrFold_2026_v02
          patch --dry-run -p2 < ../v060.patch
          patch -p2 < ../v060.patch

      - name: Apply v0.6.1 runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          echo 'f1e9b57f88e7fcdac58f5dd48b4e2e245647a9516bf41102fe765285a2aa0b9f  .lumapdf/v061.patch.gz.b64' | sha256sum -c -
          base64 --decode .lumapdf/v061.patch.gz.b64 | gzip -dc > v061.patch
          echo '35cced2699e034aeb47df61ad7521bbf93e4d92bd1a20dd8d0ef4c753ab92f7b  v061.patch' | sha256sum -c -
          cd LumaPDF_RazrFold_2026_v02
          patch --dry-run -p1 < ../v061.patch
          patch -p1 < ../v061.patch

      - name: Runtime contract regression guards
        shell: bash
        run: |
          set -euo pipefail
          ROOT='LumaPDF_RazrFold_2026_v02'
          ENGINE="$ROOT/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt"
          MAIN="$ROOT/app/src/main/java/com/tstudio/lumapdf/MainActivity.kt"
          BUILD="$ROOT/app/build.gradle.kts"

          require_literal() {
            local file="$1"; local text="$2"; local label="$3"
            if grep -Fq -- "$text" "$file"; then echo "PASS: $label"; else
              echo "FAIL: $label"; echo "Expected literal: $text"; exit 1
            fi
          }
          forbid_literal() {
            local file="$1"; local text="$2"; local label="$3"
            if grep -Fq -- "$text" "$file"; then echo "FAIL: forbidden $label"; grep -Fn -- "$text" "$file"; exit 1; else echo "PASS: $label absent"; fi
          }

          require_literal "$BUILD" 'versionCode = 8' 'v0.6.1 version code'
          require_literal "$BUILD" 'versionName = "0.6.1-runtime-hardening"' 'v0.6.1 version name'
          require_literal "$ENGINE" 'page.getAnnotations() ?: emptyArray()' 'null annotations treated as empty'
          require_literal "$ENGINE" 'val annotations = page.getAnnotations() ?: return null' 'null-safe annotation lookup'
          require_literal "$ENGINE" 'val warnings: List<String> = emptyList()' 'partial-analysis diagnostics'
          require_literal "$ENGINE" 'Text object detection limited:' 'fault-isolated text detection'
          require_literal "$ENGINE" 'Annotation scan unavailable:' 'fault-isolated annotation scan'
          require_literal "$ENGINE" 'requireNotNull(page.toPixmap' 'null-safe render pixmap contract'
          require_literal "$ENGINE" 'page.search(query).orEmpty()' 'null-safe search results'
          require_literal "$ENGINE" 'page.search(probe).orEmpty()' 'null-safe save verification search'
          require_literal "$MAIN" 'objects.warnings.isEmpty()' 'partial analysis remains usable'
          require_literal "$MAIN" 'editing ready' 'editing readiness state'
          forbid_literal "$ENGINE" 'page.getAnnotations().forEach' 'unsafe annotation forEach'
          forbid_literal "$ENGINE" 'page.getAnnotations().firstOrNull' 'unsafe annotation lookup'
          forbid_literal "$ENGINE" 'TYPE_FREE_TEXT' 'FreeText replacement regression'
          forbid_literal "$ENGINE" 'doc.bake(true, false)' 'save-time bake regression'
          forbid_literal "$ENGINE" 'bitmap.setPixels' 'unsafe raw pixel renderer'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable LumaPDF signing key
        shell: bash
        run: keytool -list -keystore LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore -storepass lumapdfdev -alias lumapdf-dev

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile LumaPDF v0.6.1
        working-directory: LumaPDF_RazrFold_2026_v02
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK='LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          file "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -Fq 'lib/arm64-v8a/libmupdf_java.so'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee LumaPDF-v061-badging.txt
          grep -Fq "versionCode='8'" LumaPDF-v061-badging.txt
          grep -Fq "versionName='0.6.1-runtime-hardening'" LumaPDF-v061-badging.txt
          cp "$APK" LumaPDF-ContentStudio-v0.6.1-RuntimeHardening-RazrFold.apk
          test -s LumaPDF-ContentStudio-v0.6.1-RuntimeHardening-RazrFold.apk
          sha256sum LumaPDF-ContentStudio-v0.6.1-RuntimeHardening-RazrFold.apk | tee LumaPDF-v061-apk.sha256

      - name: Package matching source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf LumaPDF_RazrFold_2026_v02/.gradle LumaPDF_RazrFold_2026_v02/.kotlin LumaPDF_RazrFold_2026_v02/app/build
          zip -qr LumaPDF-v061-source.zip LumaPDF_RazrFold_2026_v02
          unzip -tq LumaPDF-v061-source.zip
          sha256sum LumaPDF-v061-source.zip | tee LumaPDF-v061-source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v061-APK
          path: |
            LumaPDF-ContentStudio-v0.6.1-RuntimeHardening-RazrFold.apk
            LumaPDF-v061-apk.sha256
            LumaPDF-v061-badging.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v061-Source
          path: |
            LumaPDF-v061-source.zip
            LumaPDF-v061-source.sha256
          if-no-files-found: error
          retention-days: 14
