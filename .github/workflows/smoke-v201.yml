name: Smoke Test Veil Browser 2.0.1 Release

on:
  push:
    branches:
      - veil-browser-build
    paths:
      - .github/workflows/smoke-v201.yml
      - .github/scripts/veil-smoke.sh
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out smoke-test script
        uses: actions/checkout@v4

      - name: Download checksum-verified release build
        uses: actions/download-artifact@v4
        with:
          name: veil-browser-v2.0.1-build
          path: build
          github-token: ${{ github.token }}
          repository: tylerfreville-ai/siletshot.go
          run-id: 31984694691

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sign isolated smoke-test copy
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt \
            -keystore smoke-test.jks -storetype JKS \
            -storepass "$PASS" -keypass "$PASS" \
            -alias smoke -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Veil Smoke Test, O=Veil, C=US"
          java -jar build/tools/apksigner.jar sign \
            --ks smoke-test.jks --ks-key-alias smoke \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v4-signing-enabled false \
            --out Veil-Smoke-Test.apk \
            build/Veil-Browser-v2.0.1-unsigned.apk
          java -jar build/tools/apksigner.jar verify \
            --min-sdk-version 29 --max-sdk-version 36 --verbose \
            Veil-Smoke-Test.apk

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch compact and expanded layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          disable-animations: true
          script: bash .github/scripts/veil-smoke.sh smoke-results Veil-Smoke-Test.apk

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veil-browser-v2.0.1-smoke-results
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7
