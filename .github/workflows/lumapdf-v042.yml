name: Build LumaPDF v0.4.2 Direct Text APK

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.github/workflows/lumapdf-v042.yml'
      - '.lumapdf/patch_v042.py'
      - '.lumapdf/fix_v042_helpers.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified direct-content source
        shell: bash
        run: |
          set -euo pipefail
          cat .lumapdf/v023s.part* | base64 --decode > lumapdf-v042.zip
          echo 'e8ffe0fe190095ed9bf652e67f13be96e5eedb86d9359cd316755a27e27bc543  lumapdf-v042.zip' | sha256sum -c -
          unzip -tq lumapdf-v042.zip
          unzip -q lumapdf-v042.zip
          test -f LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt
          base64 --decode .lumapdf/lumapdf-dev.keystore.b64 > LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore
          test -s LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore

      - name: Apply direct-text persistence patch
        shell: bash
        run: |
          set -euo pipefail
          python .lumapdf/patch_v042.py
          python .lumapdf/fix_v042_helpers.py

      - name: Direct-text regression guards
        shell: bash
        run: |
          set -euo pipefail
          ENGINE='LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt'
          BUILD='LumaPDF_RazrFold_2026_v02/app/build.gradle.kts'
          grep -q 'appendPageText(doc, page, rect, text, style)' "$ENGINE"
          grep -q 'appendContentStream(doc, pageObject' "$ENGINE"
          grep -q 'doc.addSimpleFont' "$ENGINE"
          grep -q 'doc.addStream' "$ENGINE"
          grep -q 'redaction.applyRedaction' "$ENGINE"
          grep -q 'page.deleteAnnotation(redaction)' "$ENGINE"
          grep -q 'pendingTextChecks' "$ENGINE"
          grep -q 'verifySavedText(out)' "$ENGINE"
          grep -q 'page.search(probe)' "$ENGINE"
          grep -q 'BitmapFactory.decodeByteArray' "$ENGINE"
          grep -q 'versionCode = 5' "$BUILD"
          grep -q 'versionName = "0.4.2-direct-text"' "$BUILD"
          grep -q 'signingConfig = signingConfigs.getByName("lumaDev")' "$BUILD"
          if grep -q 'TYPE_FREE_TEXT' "$ENGINE"; then echo 'FreeText text replacement returned'; exit 1; fi
          if grep -q 'setRichContents' "$ENGINE"; then echo 'Unsafe rich text returned'; exit 1; fi
          if grep -q 'page.applyRedactions' "$ENGINE"; then echo 'Page-wide redaction returned'; exit 1; fi
          if grep -q 'doc.bake(true, false)' "$ENGINE"; then echo 'Save-time bake returned'; exit 1; fi
          if grep -q 'bitmap.setPixels' "$ENGINE"; then echo 'Unsafe raw pixel renderer returned'; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          s = Path('LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt').read_text()
          start = s.index('private fun editTextAt')
          end = s.index('/**', start)
          block = s[start:end]
          assert 'appendPageText(doc, page, rect, text, style)' in block
          assert 'redaction.applyRedaction(' in block
          assert 'page.applyRedactions(' not in block
          assert '\\"' not in s[s.index('private fun textProbeKey'):s.index('fun close()', s.index('private fun textProbeKey'))]
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable LumaPDF signing key
        shell: bash
        run: keytool -list -keystore LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore -storepass lumapdfdev -alias lumapdf-dev

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile v0.4.2 APK
        working-directory: LumaPDF_RazrFold_2026_v02
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          file "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmupdf_java.so'
          ls -lh "$APK"
          sha256sum "$APK" | tee LumaPDF-v042-apk.sha256

      - name: Package matching source
        shell: bash
        run: |
          zip -qr LumaPDF-v042-source.zip LumaPDF_RazrFold_2026_v02
          unzip -tq LumaPDF-v042-source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v042-APK
          path: |
            LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk
            LumaPDF-v042-apk.sha256
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v042-Source
          path: LumaPDF-v042-source.zip
          if-no-files-found: error
          retention-days: 14
