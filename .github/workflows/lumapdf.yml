name: Build LumaPDF Content Studio APK

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.lumapdf/v023.part*'
      - '.github/workflows/lumapdf.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct LumaPDF v0.2.3 source
        shell: bash
        run: |
          cat .lumapdf/v023.part* | base64 --decode > lumapdf-v023.zip
          unzip -q lumapdf-v023.zip
          test -f LumaPDF_RazrFold_2026_v02/settings.gradle.kts
          test -f LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt

      - name: Text editing regression guards
        shell: bash
        run: |
          ENGINE='LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt'
          grep -q 'appendPageText' "$ENGINE"
          grep -q 'doc.addSimpleFont' "$ENGINE"
          grep -q 'doc.addStream' "$ENGINE"
          grep -q 'appendContentStream' "$ENGINE"
          grep -q 'doc.abandonOperation()' "$ENGINE"
          grep -q 'pix.asPNG()' "$ENGINE"
          if grep -q 'setRichContents' "$ENGINE"; then echo 'Unsafe rich-text annotation path returned'; exit 1; fi
          if grep -q 'TYPE_FREE_TEXT' "$ENGINE"; then echo 'FreeText replacement path returned'; exit 1; fi
          if grep -q 'bitmap.setPixels' "$ENGINE"; then echo 'Unsafe raw pixel renderer returned'; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build v0.2.3 APK
        working-directory: LumaPDF_RazrFold_2026_v02
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK='LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          file "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v023-APK
          path: LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
