name: Diagnose LumaPDF text persistence

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.github/workflows/lumapdf-diagnose.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare current annotation engine with direct-content engine
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .lumapdf/engine_v041.gz.b64 | gzip -dc > /tmp/current.kt
          cat .lumapdf/v023s.part* | base64 --decode > /tmp/v023.zip
          echo 'e8ffe0fe190095ed9bf652e67f13be96e5eedb86d9359cd316755a27e27bc543  /tmp/v023.zip' | sha256sum -c -
          unzip -q /tmp/v023.zip -d /tmp/v023
          OLD='/tmp/v023/LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt'
          echo '=== CURRENT v0.4.1 persistence ==='
          grep -nE 'fun (saveAs|replacePageText|createFreeTextOnPage|setExplicitTextAppearance)|doc.bake|setAppearance' /tmp/current.kt || true
          echo '=== DIRECT CONTENT implementation ==='
          grep -nE 'fun (saveAs|replacePageText|appendPageText|appendContentStream)|addSimpleFont|addStream|Contents|Resources' "$OLD" || true
          echo '=== DIRECT CONTENT code blocks ==='
          awk '
            /fun replacePageText|fun appendPageText|fun appendContentStream|fun saveAs/ {show=1; count=0}
            show {print NR ":" $0; count++}
            show && count>140 {show=0}
          ' "$OLD"
