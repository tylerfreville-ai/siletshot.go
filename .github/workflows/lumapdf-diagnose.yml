name: Diagnose LumaPDF text persistence

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.github/workflows/lumapdf-diagnose.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect direct-content engine fields and save path
        shell: bash
        run: |
          set -euo pipefail
          cat .lumapdf/v023s.part* | base64 --decode > /tmp/v023.zip
          echo 'e8ffe0fe190095ed9bf652e67f13be96e5eedb86d9359cd316755a27e27bc543  /tmp/v023.zip' | sha256sum -c -
          unzip -q /tmp/v023.zip -d /tmp/v023
          ENGINE='/tmp/v023/LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt'
          echo '=== HEADER / FIELDS ==='
          sed -n '1,120p' "$ENGINE"
          echo '=== EDIT PATH ==='
          sed -n '185,235p' "$ENGINE"
          echo '=== SAVE PATH ==='
          sed -n '570,610p' "$ENGINE"
