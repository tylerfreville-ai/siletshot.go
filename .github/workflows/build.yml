name: Build Veil Browser 2.0.1 APK

on:
  push:
    branches:
      - veil-browser-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4

      - name: Restore and verify reviewed Veil 2.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v201s_*.b64 | base64 --decode > veil-browser-v2.0.1-source-payload.tar.gz
          echo "08193c04e3916be226bc43cf3566121d8eeb4b02a5301db043541584055042b0  veil-browser-v2.0.1-source-payload.tar.gz" | sha256sum --check
          mkdir -p veil-src
          tar -xzf veil-browser-v2.0.1-source-payload.tar.gz -C veil-src
          test -f veil-src/settings.gradle.kts
          grep -q 'androidx.webkit:webkit:1.17.0' veil-src/app/build.gradle.kts
          grep -q 'versionName = "2.0.1"' veil-src/app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile optimized release APK
        working-directory: veil-src
        run: gradle --no-daemon clean assembleRelease

      - name: Prepare unsigned APK and verification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          cp veil-src/app/build/outputs/apk/release/app-release-unsigned.apk dist/Veil-Browser-v2.0.1-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" dist/tools/zipalign
          chmod +x dist/tools/zipalign
          sha256sum dist/Veil-Browser-v2.0.1-unsigned.apk > dist/UNSIGNED_SHA256.txt
          printf '%s\n' 'Source SHA-256: 08193c04e3916be226bc43cf3566121d8eeb4b02a5301db043541584055042b0' > dist/BUILD_SOURCE.txt

      - name: Upload Veil 2.0.1 build
        uses: actions/upload-artifact@v4
        with:
          name: veil-browser-v2.0.1-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
