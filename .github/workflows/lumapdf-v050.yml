name: Build LumaPDF v0.5 Direct Manipulation APK

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.github/workflows/lumapdf-v050.yml'
      - '.lumapdf/main_v050.gz.b64'
      - '.lumapdf/engine_v050.gz.b64'
      - '.lumapdf/canvas_v050.gz.b64'
      - '.lumapdf/patch_v042.py'
      - '.lumapdf/v023s.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified LumaPDF base
        shell: bash
        run: |
          set -euo pipefail
          cat .lumapdf/v023s.part* | base64 --decode > LumaPDF-base.zip
          echo 'e8ffe0fe190095ed9bf652e67f13be96e5eedb86d9359cd316755a27e27bc543  LumaPDF-base.zip' | sha256sum -c -
          unzip -tq LumaPDF-base.zip
          unzip -q LumaPDF-base.zip
          base64 --decode .lumapdf/lumapdf-dev.keystore.b64 > LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore
          test -s LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore

      - name: Apply v0.4.2 persistent text foundation
        shell: bash
        run: |
          set -euo pipefail
          python .lumapdf/patch_v042.py

      - name: Install exact v0.5 editor sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT='LumaPDF_RazrFold_2026_v02'
          BASE="$ROOT/app/src/main/java/com/tstudio/lumapdf"
          base64 --decode .lumapdf/main_v050.gz.b64 | gzip -dc > "$BASE/MainActivity.kt"
          base64 --decode .lumapdf/engine_v050.gz.b64 | gzip -dc > "$BASE/editor/MuPdfEngine.kt"
          base64 --decode .lumapdf/canvas_v050.gz.b64 | gzip -dc > "$BASE/editor/PageCanvasView.kt"
          echo 'cba5e438febd5fe3c64c607755a9dc2386a271e1bec050ed7fcb4c33bff27560  '"$BASE/MainActivity.kt" | sha256sum -c -
          echo '6057cb5678abadb5a27a7a0c1e877d995afc09e01b0dff3e19058637273b2e7e  '"$BASE/editor/MuPdfEngine.kt" | sha256sum -c -
          echo 'bdf98e3588468be807bb8ffffb5a7525da1446305dca69c36749569cc4f8598d  '"$BASE/editor/PageCanvasView.kt" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('LumaPDF_RazrFold_2026_v02/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 6', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.5.0-direct-manipulation"', s, count=1)
          p.write_text(s)
          PY

      - name: Direct manipulation regression guards
        shell: bash
        run: |
          set -euo pipefail
          ROOT='LumaPDF_RazrFold_2026_v02'
          ENGINE="$ROOT/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt"
          CANVAS="$ROOT/app/src/main/java/com/tstudio/lumapdf/editor/PageCanvasView.kt"
          MAIN="$ROOT/app/src/main/java/com/tstudio/lumapdf/MainActivity.kt"
          BUILD="$ROOT/app/build.gradle.kts"

          require_literal() {
            local file="$1"
            local text="$2"
            local label="$3"
            if grep -Fq -- "$text" "$file"; then echo "PASS: $label"; else
              echo "FAIL: $label"; echo "Expected literal: $text"; echo "File: $file"; exit 1
            fi
          }
          forbid_literal() {
            local file="$1"
            local text="$2"
            local label="$3"
            if grep -Fq -- "$text" "$file"; then
              echo "FAIL: forbidden $label returned"; grep -Fn -- "$text" "$file" || true; exit 1
            else echo "PASS: $label absent"; fi
          }

          require_literal "$BUILD" 'versionCode = 6' 'version code'
          require_literal "$BUILD" 'versionName = "0.5.0-direct-manipulation"' 'version name'
          require_literal "$CANVAS" 'ScaleGestureDetector' 'pinch zoom detector'
          require_literal "$CANVAS" 'MAX_ZOOM = 6f' '6x zoom ceiling'
          require_literal "$CANVAS" 'fun onTextMoved' 'text drag callback'
          require_literal "$CANVAS" 'fun onImageTransformed' 'image transform callback'
          require_literal "$CANVAS" 'private fun resizeRect' 'image resize handles'
          require_literal "$CANVAS" 'private fun translatedInside' 'bounded object movement'
          require_literal "$ENGINE" 'fun moveText' 'text movement engine'
          require_literal "$ENGINE" 'fun deleteText' 'text deletion engine'
          require_literal "$ENGINE" 'fun duplicateText' 'text duplication engine'
          require_literal "$ENGINE" 'fun addTextMarkup' 'text markup engine'
          require_literal "$ENGINE" 'fun moveImage' 'image movement engine'
          require_literal "$ENGINE" 'fun duplicateImage' 'image duplication engine'
          require_literal "$ENGINE" 'fun movePage' 'page movement engine'
          require_literal "$ENGINE" 'fun duplicatePage' 'page duplication engine'
          require_literal "$ENGINE" 'fun insertBlankPage' 'blank page insertion'
          require_literal "$ENGINE" 'doc.rearrangePages' 'native page rearrangement'
          require_literal "$ENGINE" 'appendPageText(doc, page, newRect' 'moved text remains direct page content'
          require_literal "$ENGINE" 'redaction.applyRedaction' 'object-local content removal'
          require_literal "$ENGINE" 'verifySavedText(out)' 'save/reopen text verifier'
          require_literal "$MAIN" 'showZoomMenu' 'zoom menu UI'
          require_literal "$MAIN" 'duplicateSelection' 'duplicate selection UI'
          require_literal "$MAIN" 'deleteSelection' 'delete selection UI'
          require_literal "$MAIN" 'showMarkupMenu' 'markup selection UI'
          forbid_literal "$ENGINE" 'TYPE_FREE_TEXT' 'FreeText text editing path'
          forbid_literal "$ENGINE" 'doc.bake(true, false)' 'save-time annotation bake'
          forbid_literal "$ENGINE" 'bitmap.setPixels' 'unsafe raw-pixel renderer'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable LumaPDF signing key
        shell: bash
        run: keytool -list -keystore LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore -storepass lumapdfdev -alias lumapdf-dev

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile LumaPDF v0.5
        working-directory: LumaPDF_RazrFold_2026_v02
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          file "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -Fq 'lib/arm64-v8a/libmupdf_java.so'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee LumaPDF-v050-badging.txt
          grep -Fq "versionName='0.5.0-direct-manipulation'" LumaPDF-v050-badging.txt
          ls -lh "$APK"
          sha256sum "$APK" | tee LumaPDF-v050-apk.sha256

      - name: Package matching source
        shell: bash
        run: |
          set -euo pipefail
          zip -qr LumaPDF-v050-source.zip LumaPDF_RazrFold_2026_v02
          unzip -tq LumaPDF-v050-source.zip
          sha256sum LumaPDF-v050-source.zip | tee LumaPDF-v050-source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v050-APK
          path: |
            LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk
            LumaPDF-v050-apk.sha256
            LumaPDF-v050-badging.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v050-Source
          path: |
            LumaPDF-v050-source.zip
            LumaPDF-v050-source.sha256
          if-no-files-found: error
          retention-days: 14
