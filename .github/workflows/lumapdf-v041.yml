name: Build LumaPDF v0.4.1 Editable Text APK

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.lumapdf/engine041.part*'
      - '.github/workflows/lumapdf-v041.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct known-good LumaPDF base
        shell: bash
        run: |
          cat .lumapdf/v02.part* | base64 --decode > lumapdf-base.zip
          unzip -q lumapdf-base.zip
          test -f LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/MainActivity.kt

      - name: Install v0.4.1 text engine
        shell: bash
        run: |
          ENGINE='LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt'
          cat .lumapdf/engine041.part* | base64 --decode | gzip -dc > "$ENGINE"
          echo 'b9e2a2881b8816dbc559ec112633ead891c351f7b132543fcc30f0582bd3fc7a  '"$ENGINE" | sha256sum -c -

      - name: Apply UI, compiler, version and signing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf')

          p = base / 'MainActivity.kt'
          s = p.read_text()
          s = s.replace(
              'private fun showTextEditor(existing: MuPdfEngine.TextObject?, targetRect: Rect = existing?.rect ?: return) {\n        val p = UiKit.palette(this)',
              'private fun showTextEditor(existing: MuPdfEngine.TextObject?, targetRect: Rect? = existing?.rect) {\n        val resolvedRect = targetRect ?: return\n        val p = UiKit.palette(this)'
          )
          s = s.replace('engine.addText(currentPage, targetRect, value, style)', 'engine.addText(currentPage, resolvedRect, value, style)')
          s = s.replace(
              'if (bytes.isNullOrEmpty()) { toast("Could not read that image."); return }',
              'if (bytes == null || bytes.isEmpty()) { toast("Could not read that image."); return }\n        val imageBytes = bytes'
          )
          s = s.replace('engine.replaceImage(currentPage, obj, bytes)', 'engine.replaceImage(currentPage, obj, imageBytes)')
          s = s.replace('showInsertImageDialog(bytes)', 'showInsertImageDialog(imageBytes)')
          s = s.replace(
              'result.onSuccess { renderCurrentPage() }.onFailure { toast(it.message ?: "$label failed") }',
              'result.onSuccess { renderCurrentPage() }.onFailure {\n                renderCurrentPage()\n                toast(it.message ?: "$label failed")\n            }'
          )
          p.write_text(s)

          p = base / 'editor' / 'PageCanvasView.kt'
          s = p.read_text()
          if 'pageBackgroundPaint' not in s:
              s = s.replace(
                  '    private val pagePaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)\n    private val shadowPaint',
                  '    private val pagePaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)\n    private val pageBackgroundPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }\n    private val shadowPaint'
              )
              s = s.replace(
                  '        canvas.drawRoundRect(RectF(left + 3, top + 8, left + drawW + 3, top + drawH + 8), 8f, 8f, shadowPaint)\n        canvas.drawBitmap(bm, null, dst, pagePaint)',
                  '        canvas.drawRoundRect(RectF(left + 3, top + 8, left + drawW + 3, top + drawH + 8), 8f, 8f, shadowPaint)\n        canvas.drawRect(dst, pageBackgroundPaint)\n        canvas.drawBitmap(bm, null, dst, pagePaint)'
              )
          s = s.replace(
              '        if (mode == Mode.SELECT) {\n            s.textObjects.forEach { canvas.drawRect(toScreen(it.rect), editHintPaint) }\n        }\n',
              '        // Hit testing remains active; only the selected object is outlined.\n'
          )
          p.write_text(s)

          p = Path('LumaPDF_RazrFold_2026_v02/app/build.gradle.kts')
          s = p.read_text()
          import re
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 4', s)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.4.1-editable-text"', s)
          if 'signingConfigs {' not in s:
              marker = '''    buildFeatures {\n        viewBinding = false\n        buildConfig = true\n    }\n'''
              signing = '''    signingConfigs {\n        create("lumaDev") {\n            storeFile = file("lumapdf-dev.keystore")\n            storePassword = "lumapdfdev"\n            keyAlias = "lumapdf-dev"\n            keyPassword = "lumapdfdev"\n        }\n    }\n\n    buildTypes {\n        getByName("debug") {\n            signingConfig = signingConfigs.getByName("lumaDev")\n        }\n    }\n\n    buildFeatures {\n        viewBinding = false\n        buildConfig = true\n    }\n'''
              if marker not in s:
                  raise SystemExit('Could not find buildFeatures block for signing patch')
              s = s.replace(marker, signing)
          p.write_text(s)
          PY

          base64 --decode .lumapdf/lumapdf-dev.keystore.b64 > LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore

      - name: Text-editing regression guards
        shell: bash
        run: |
          ENGINE='LumaPDF_RazrFold_2026_v02/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt'
          BUILD='LumaPDF_RazrFold_2026_v02/app/build.gradle.kts'
          grep -q 'annotationObjectNumber' "$ENGINE"
          grep -q 'page.getAnnotations()' "$ENGINE"
          grep -q 'setExplicitTextAppearance' "$ENGINE"
          grep -q 'annot.setAppearance(Rect' "$ENGINE"
          grep -q 'createFreeTextOnPage(page, originalRect, text, style)' "$ENGINE"
          grep -q 'redaction.applyRedaction' "$ENGINE"
          grep -q 'Helvetica-BoldOblique' "$ENGINE"
          grep -q 'BitmapFactory.decodeByteArray' "$ENGINE"
          grep -q 'versionCode = 4' "$BUILD"
          grep -q 'versionName = "0.4.1-editable-text"' "$BUILD"
          if grep -q 'setRichContents' "$ENGINE"; then echo 'Rich-content-dependent editor returned'; exit 1; fi
          if grep -q 'richDefaults' "$ENGINE"; then echo 'Broken richDefaults JNI path returned'; exit 1; fi
          if grep -q 'bitmap.setPixels' "$ENGINE"; then echo 'Unsafe raw pixel rendering returned'; exit 1; fi
          if grep -q 'page.applyRedactions' "$ENGINE"; then echo 'Page-wide redaction returned'; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable LumaPDF signing key
        shell: bash
        run: keytool -list -keystore LumaPDF_RazrFold_2026_v02/app/lumapdf-dev.keystore -storepass lumapdfdev -alias lumapdf-dev

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile v0.4.1 APK
        working-directory: LumaPDF_RazrFold_2026_v02
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK='LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          file "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee LumaPDF-v041-apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v041-APK
          path: |
            LumaPDF_RazrFold_2026_v02/app/build/outputs/apk/debug/app-debug.apk
            LumaPDF-v041-apk.sha256
          if-no-files-found: error
          retention-days: 14
