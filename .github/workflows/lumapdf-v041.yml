name: Build LumaPDF v0.4.2 Direct Text APK

on:
  push:
    branches: [lumapdf-build]
    paths:
      - '.lumapdf/v042_patch.py'
      - '.github/workflows/lumapdf-v041.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified direct-content base
        shell: bash
        run: |
          set -euo pipefail
          cat .lumapdf/v023s.part* | base64 --decode > lumapdf-base.zip
          echo 'e8ffe0fe190095ed9bf652e67f13be96e5eedb86d9359cd316755a27e27bc543  lumapdf-base.zip' | sha256sum -c -
          unzip -tq lumapdf-base.zip
          unzip -q lumapdf-base.zip
          mv LumaPDF_RazrFold_2026_v02 LumaPDF_RazrFold_2026_v042
          test -f LumaPDF_RazrFold_2026_v042/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt

      - name: Apply v0.4.2 persistence patch
        shell: bash
        run: |
          python .lumapdf/v042_patch.py
          base64 --decode .lumapdf/lumapdf-dev.keystore.b64 > LumaPDF_RazrFold_2026_v042/app/lumapdf-dev.keystore
          test -s LumaPDF_RazrFold_2026_v042/app/lumapdf-dev.keystore

      - name: Direct text regression guards
        shell: bash
        run: |
          set -euo pipefail
          ENGINE='LumaPDF_RazrFold_2026_v042/app/src/main/java/com/tstudio/lumapdf/editor/MuPdfEngine.kt'
          CANVAS='LumaPDF_RazrFold_2026_v042/app/src/main/java/com/tstudio/lumapdf/editor/PageCanvasView.kt'
          BUILD='LumaPDF_RazrFold_2026_v042/app/build.gradle.kts'
          grep -q 'appendPageText(doc, page, rect, text, style)' "$ENGINE"
          grep -q 'appendContentStream(doc, pageObject' "$ENGINE"
          grep -q 'doc.addSimpleFont' "$ENGINE"
          grep -q 'doc.addStream' "$ENGINE"
          grep -q 'redaction.applyRedaction' "$ENGINE"
          grep -q 'verifySavedText(out)' "$ENGINE"
          grep -q 'page.search(probe)' "$ENGINE"
          grep -q 'garbage=2,compress,compress-images' "$ENGINE"
          grep -q 'pix.asPNG()' "$ENGINE"
          grep -q 'BitmapFactory.decodeByteArray' "$ENGINE"
          grep -q 'pageBackgroundPaint' "$CANVAS"
          grep -q 'versionCode = 5' "$BUILD"
          grep -q 'versionName = "0.4.2-direct-text"' "$BUILD"
          grep -q 'signingConfig = signingConfigs.getByName("lumaDev")' "$BUILD"
          ! grep -q 'TYPE_FREE_TEXT' "$ENGINE"
          ! grep -q 'setRichContents' "$ENGINE"
          ! grep -q 'richDefaults' "$ENGINE"
          ! grep -q 'page.applyRedactions' "$ENGINE"
          ! grep -q 'doc.bake(true, false)' "$ENGINE"
          ! grep -q 'bitmap.setPixels' "$ENGINE"

      - name: Package exact source
        shell: bash
        run: |
          zip -qr LumaPDF-v042-source.zip LumaPDF_RazrFold_2026_v042
          unzip -tq LumaPDF-v042-source.zip
          sha256sum LumaPDF-v042-source.zip | tee LumaPDF-v042-source.sha256

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify stable signing key
        shell: bash
        run: keytool -list -keystore LumaPDF_RazrFold_2026_v042/app/lumapdf-dev.keystore -storepass lumapdfdev -alias lumapdf-dev

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile v0.4.2 APK
        working-directory: LumaPDF_RazrFold_2026_v042
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='LumaPDF_RazrFold_2026_v042/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          file "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmupdf_java.so'
          ls -lh "$APK"
          sha256sum "$APK" | tee LumaPDF-v042-apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v042-APK
          path: |
            LumaPDF_RazrFold_2026_v042/app/build/outputs/apk/debug/app-debug.apk
            LumaPDF-v042-apk.sha256
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: LumaPDF-ContentStudio-v042-Source
          path: |
            LumaPDF-v042-source.zip
            LumaPDF-v042-source.sha256
          if-no-files-found: error
          retention-days: 14
